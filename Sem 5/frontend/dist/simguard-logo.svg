<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="sgGrad" x1="10" y1="6" x2="38" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="chipStroke" x1="14" y1="14" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>

  <!-- SIM Card / Shield Hybrid Contour -->
  <path d="M 12 6 C 10.895 6 10 6.895 10 8 L 10 24 C 10 33.8 17.2 40.8 24 43.5 C 30.8 40.8 38 33.8 38 24 L 38 14 L 30 6 L 12 6 Z" 
        fill="url(#sgGrad)" />
  
  <!-- Subtle Inner Contour Highlight -->
  <path d="M 12.5 7.5 L 29.4 7.5 L 36.5 14.6 L 36.5 24 C 36.5 33 29.8 39.7 24 42.1 C 18.2 39.7 11.5 33 11.5 24 L 11.5 8.5 C 11.5 7.9 11.9 7.5 12.5 7.5 Z" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1" fill="none" stroke-linejoin="round"/>

  <!-- Gold/Circuit SIM Microchip Core -->
  <rect x="18" y="16" width="12" height="15" rx="2.5" fill="#0D1420" stroke="url(#chipStroke)" stroke-width="1.6"/>
  
  <!-- Horizontal Center Trace -->
  <line x1="18" y1="23.5" x2="30" y2="23.5" stroke="url(#chipStroke)" stroke-width="1.2"/>
  
  <!-- Left Trace Contacts -->
  <path d="M 14 19.5 L 18 19.5 M 14 27.5 L 18 27.5" stroke="url(#chipStroke)" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Right Trace Contacts -->
  <path d="M 30 19.5 L 34 19.5 M 30 27.5 L 34 27.5" stroke="url(#chipStroke)" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Top Trace Contact -->
  <line x1="24" y1="12" x2="24" y2="16" stroke="url(#chipStroke)" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Verification Shield Checkmark Emblem -->
  <path d="M 21 35 L 23.2 37.2 L 27.5 33" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

